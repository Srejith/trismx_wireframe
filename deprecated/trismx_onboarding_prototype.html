<title>TrismX Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --surface-3:#E5EBF2;
    --border:#DBE2EC; --border-strong:#C4CEDB;
    --ink:#16202E; --ink-2:#33415A; --muted:#657288;
    --accent:#0E7C7B; --accent-2:#0A5F5E; --accent-tint:#E1F1F0; --on-accent:#FFFFFF;
    --ok:#157A54; --ok-tint:#E4F3EC;
    --warn:#B4530A; --warn-tint:#FBEEDF;
    --crit:#C33A3A; --crit-tint:#FBE7E7;
    --high:#B0332F; --high-tint:#FADEDD;
    --shadow:0 1px 2px rgba(20,32,46,.06),0 6px 16px rgba(20,32,46,.06);
    color-scheme:light;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#0D1319; --surface:#151D27; --surface-2:#1B2530; --surface-3:#22303C;
    --border:#2A3744; --border-strong:#3A4B5C;
    --ink:#E8EEF5; --ink-2:#BDC9D7; --muted:#8797A9;
    --accent:#2FB6B0; --accent-2:#54C7C1; --accent-tint:#123331; --on-accent:#05201F;
    --ok:#4CC08A; --ok-tint:#123026;
    --warn:#E0913C; --warn-tint:#33240F;
    --crit:#E76D6D; --crit-tint:#341A1A;
    --high:#EA7370; --high-tint:#361B1A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0D1319; --surface:#151D27; --surface-2:#1B2530; --surface-3:#22303C;
    --border:#2A3744; --border-strong:#3A4B5C;
    --ink:#E8EEF5; --ink-2:#BDC9D7; --muted:#8797A9;
    --accent:#2FB6B0; --accent-2:#54C7C1; --accent-tint:#123331; --on-accent:#05201F;
    --ok:#4CC08A; --ok-tint:#123026;
    --warn:#E0913C; --warn-tint:#33240F;
    --crit:#E76D6D; --crit-tint:#341A1A;
    --high:#EA7370; --high-tint:#361B1A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:248px 1fr;height:100%;min-height:0}
  .rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--border)}
  .logo{width:26px;height:26px;border-radius:7px;flex:none;background:
     conic-gradient(from 200deg,var(--accent),#3AA0B8,#7C6CD6,var(--accent));
     box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .brand b{font-weight:700;letter-spacing:.2px}
  .brand span{color:var(--muted);font-size:11.5px;display:block;margin-top:-2px}
  .steps{list-style:none;margin:0;padding:10px;overflow:auto;flex:1;min-height:0}
  .steps li{margin:1px 0}
  .step-btn{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;
     background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--ink-2);font:inherit}
  .step-btn:hover{background:var(--surface-2)}
  .step-btn.active{background:var(--accent-tint);color:var(--ink)}
  .step-btn.active .idx{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .idx{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);
     display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface)}
  .step-btn.done .idx{background:var(--ok);border-color:var(--ok);color:#fff}
  .step-label{font-size:13px;font-weight:500}
  .step-sub{font-size:11px;color:var(--muted)}
  .rail-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--border);background:var(--surface)}
  .ctx{display:flex;align-items:center;gap:10px;min-width:0}
  .ctx .co{font-weight:600}
  .mandate{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);
     background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .content{overflow:auto;flex:1;min-height:0;padding:26px 22px 30px}
  .wrap{max-width:940px;margin:0 auto;padding-inline:2px}
  .footer{border-top:1px solid var(--border);background:var(--surface);
     display:flex;align-items:center;gap:12px;padding:12px 22px}
  .prog{flex:1;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
  .footer .pct{font-size:12px;color:var(--muted);min-width:96px}

  /* ---------- Buttons / chips ---------- */
  .btn{font:inherit;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink)}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn:disabled{opacity:.4;cursor:default}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
  .switch{width:34px;height:19px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);position:relative;transition:.2s}
  .switch::after{content:"";position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .toggle.on .switch{background:var(--accent);border-color:var(--accent)}
  .toggle.on .switch::after{left:16px}

  .eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-2);font-weight:600}
  .h-lead{font-size:24px;font-weight:700;margin:6px 0 6px}
  .lead{color:var(--ink-2);max-width:64ch}
  .grid{display:grid;gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px}
  .card h3{font-size:14.5px;font-weight:600}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid transparent;white-space:nowrap}
  .pill.ok{background:var(--ok-tint);color:var(--ok)}
  .pill.warn{background:var(--warn-tint);color:var(--warn)}
  .pill.crit{background:var(--crit-tint);color:var(--crit)}
  .pill.high{background:var(--high-tint);color:var(--high)}
  .pill.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--border)}
  .pill.accent{background:var(--accent-tint);color:var(--accent-2)}
  .tag{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px}

  /* ---------- Form ---------- */
  .field{margin-bottom:14px}
  .field > label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
  .field .hint{font-size:12px;color:var(--muted);margin-bottom:8px}
  select,input[type=text]{width:100%;font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--border-strong);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:500;background:var(--surface)}
  .chip.sel{border-color:var(--accent);background:var(--accent-tint);color:var(--ink)}
  .chip .k{width:9px;height:9px;border-radius:3px;background:var(--border-strong)}
  .chip.sel .k{background:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden}
  .seg button{font:inherit;border:0;background:var(--surface);padding:8px 14px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--border)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}

  .target{display:flex;align-items:center;gap:12px;background:var(--accent-tint);border:1px solid var(--accent);
     border-radius:12px;padding:14px 16px;margin-top:6px}
  .target .big{font-size:30px;font-weight:700;color:var(--accent-2);line-height:1}

  /* integration cards */
  .int{display:flex;flex-direction:column;gap:10px}
  .int .top{display:flex;align-items:flex-start;gap:11px}
  .int .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;flex:none;color:var(--accent-2)}
  .int h3{font-size:13.5px}
  .int .feeds{font-size:11.5px;color:var(--muted)}
  .collect{font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
  .bar{height:4px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
  .tile .v{font-size:26px;font-weight:700;line-height:1}
  .tile .l{font-size:11.5px;color:var(--muted);margin-top:5px}
  .tile.flag{border-color:var(--high);background:var(--high-tint)}
  .tile.flag .v{color:var(--high)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  .tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
  tr:last-child td{border-bottom:0}
  td.wrap-cell{white-space:normal;min-width:180px}
  .rowhi{background:var(--high-tint)}

  /* mapping matrix */
  .matrix td,.matrix th{text-align:center}
  .matrix td:first-child,.matrix th:first-child{text-align:left;white-space:normal;min-width:170px}
  .cvg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:700}
  .cvg.y{background:var(--ok-tint);color:var(--ok)}
  .cvg.g{background:var(--warn-tint);color:var(--warn)}
  .cvg.n{background:var(--surface-2);color:var(--muted)}

  /* exceptions */
  .exc{display:flex;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
  .exc .stripe{width:5px;flex:none}
  .exc.h .stripe{background:var(--high)} .exc.m .stripe{background:var(--warn)} .exc.l .stripe{background:var(--accent)}
  .exc .body{padding:12px 14px;flex:1;min-width:0}
  .exc .body .t{font-weight:600}
  .exc .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}

  /* dashboard */
  .meters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .meter h3{font-size:13px}
  .meter .row{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 6px}
  .meter .p{font-size:28px;font-weight:700}
  .track{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .track i{display:block;height:100%;border-radius:999px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* design notes */
  .note{display:none;margin-top:14px;border:1px dashed var(--accent);background:var(--accent-tint);
     border-radius:11px;padding:12px 14px}
  body.notes .note{display:block}
  .note .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent-2)}
  .note p{margin:5px 0 0;color:var(--ink-2);font-size:12.5px}
  .note .src{font-size:11px;color:var(--muted);margin-top:6px}

  .sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
  .sectionhead h2{font-size:15px;font-weight:600}
  .demo-flag{font-size:11px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:7px;padding:3px 8px}
  .cols-2{grid-template-columns:1fr 1fr}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .cols-4{grid-template-columns:repeat(4,1fr)}
  .stack{display:flex;flex-direction:column;gap:10px}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .rail{border-right:0;border-bottom:1px solid var(--border)}
    .brand{border-bottom:0;padding-bottom:8px}
    .steps{display:flex;gap:6px;padding:0 10px 12px;overflow-x:auto}
    .steps li{margin:0}
    .step-btn{flex-direction:column;align-items:center;width:auto;min-width:82px;text-align:center;gap:5px;padding:8px}
    .step-sub{display:none}
    .step-label{font-size:11px}
    .rail-foot{display:none}
    .cols-2,.cols-3,.cols-4,.tiles,.meters{grid-template-columns:1fr 1fr}
    .mandate{display:none}
  }
  @media (max-width:520px){
    .tiles,.cols-3,.cols-4,.meters{grid-template-columns:1fr}
    .content{padding:18px 16px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="app">
  <!-- RAIL -->
  <nav class="rail">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div><b>TrismX</b><span>AI governance onboarding</span></div>
    </div>
    <ul class="steps" id="steps"></ul>
    <div class="rail-foot">
      <label class="toggle" id="notesToggle" title="Show design rationale on each screen">
        <span class="switch"></span> Design notes
      </label>
      <button class="btn ghost" id="themeBtn" title="Toggle light / dark" style="padding:6px 9px">◐</button>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="ctx">
        <span class="dot"></span>
        <span class="co">Nova Pay Europe</span>
        <span class="tag">Illustrative scenario</span>
      </div>
      <div class="mandate"><span class="dot"></span> Board mandate · Q4 — “Assess our AI governance”</div>
    </div>

    <div class="content">
      <div class="wrap" id="views"><!-- views injected --></div>
    </div>

    <div class="footer">
      <button class="btn" id="backBtn">Back</button>
      <div class="prog"><i id="progBar"></i></div>
      <span class="pct num mono" id="pctTxt">Step 1 / 8</span>
      <button class="btn primary" id="nextBtn">Continue</button>
    </div>
  </div>
</div>

<script>
const STEPS = [
  {n:1, key:"frame",   label:"Frame",        sub:"Scope & target"},
  {n:2, key:"connect", label:"Connect",      sub:"Optional sources"},
  {n:3, key:"bia",     label:"Risk frame",   sub:"BIA"},
  {n:4, key:"found",   label:"What we found",sub:"Shadow AI"},
  {n:5, key:"admt",    label:"ADMT",         sub:"Decision detection"},
  {n:6, key:"map",     label:"Map",          sub:"3 frameworks"},
  {n:7, key:"exc",     label:"Exceptions",   sub:"Owners & tasks"},
  {n:8, key:"dash",    label:"Zero-exceptions",sub:"Outcome"},
];

/* ---- view builders (return HTML strings) ---- */
function note(title, body, src){
  return `<div class="note"><div class="lab">Design note — ${title}</div><p>${body}</p>${src?`<div class="src">${src}</div>`:""}</div>`;
}

const views = {
frame: () => `
  <div class="eyebrow">Step 1 · Frame the assessment</div>
  <h1 class="h-lead">Set the scope, and the number we drive to zero.</h1>
  <p class="lead">Governance starts from risk and scope — not a full inventory sweep. Define the entity, which laws reach it, and the tolerance. Everything after this is bounded by these answers.</p>

  <div class="grid cols-2" style="margin-top:18px">
    <div class="card">
      <div class="field">
        <label for="entity">Regulated entity in scope</label>
        <div class="hint">One legal entity at a time — scope is defined, not assumed.</div>
        <select id="entity"><option>Nova Pay Europe DAC — Dublin (consumer lending)</option><option>Nova Pay Ltd — London</option><option>Nova Pay group (all entities)</option></select>
      </div>
      <div class="field">
        <label>EU nexus</label>
        <div class="hint">Does this entity’s AI output reach people in the EU?</div>
        <div class="seg" role="group" aria-label="EU nexus">
          <button class="on">Yes — EU AI Act applies</button><button>No</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Risk tolerance</label>
        <div class="hint">Sets the threshold at which a gap becomes an exception.</div>
        <div class="seg" role="group" aria-label="Risk tolerance">
          <button>Conservative</button><button class="on">Balanced</button><button>Permissive</button>
        </div>
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <label style="display:block;font-weight:600;font-size:13px;margin-bottom:8px">Frameworks in scope</label>
        <div class="chips">
          <span class="chip sel"><span class="k"></span> ISO/IEC 42001</span>
          <span class="chip sel"><span class="k"></span> NIST AI RMF</span>
          <span class="chip sel"><span class="k"></span> EU AI Act</span>
          <span class="chip"><span class="k"></span> DORA</span>
          <span class="chip"><span class="k"></span> SOC 2</span>
        </div>
        <p class="muted" style="font-size:12px;margin:12px 0 0">You pick the frameworks once. You never assemble evidence per framework — TrismX maps a single body of work to all three.</p>
      </div>
      <div class="target">
        <div class="big num">0</div>
        <div><strong>open exceptions</strong> across ISO 42001, NIST AI RMF & EU AI Act.<br><span class="muted" style="font-size:12.5px">The single number leadership will be shown.</span></div>
      </div>
    </div>
  </div>
  ${note("Risk → owner → scope → detect",
    "Onboarding opens on scope and tolerance, not a scan. Two practitioners point here independently — Emma (human-in-the-loop on the high-risk piece) and Neil (\"your whole control system is based on risk\"). The target — zero exceptions — is fixed now so every later screen is measured against it.",
    "master_insights_catalogue · Solution Direction (2026-09-25, strong)")}
`,

connect: () => {
  const ints = [
    ["Network egress","Outbound calls to AI endpoints & unsanctioned APIs","Direct-API shadow AI", true, 100, "3,412 flows"],
    ["AI Gateway","Sanctioned model & LLM traffic, prompts through the front door","Sanctioned usage", true, 100, "1,208 sessions"],
    ["IAM","Identities, SSO-connected apps, org structure & owners","BIA org + owners", true, 100, "914 identities"],
    ["SIEM","Correlated log signals across the estate","Cross-source evidence", true, 64, "collecting…"],
    ["Endpoint management","Local & personal-device AI apps, browser extensions","Personal-device shadow AI", false, 0, ""],
    ["Approval SaaS","The sanctioned-app list and the access gate itself","Sanctioned vs actual", false, 0, ""],
  ];
  return `
  <div class="eyebrow">Step 2 · Connect sources <span class="pill neutral" style="margin-left:6px">Optional</span></div>
  <h1 class="h-lead">The more you connect, the less you enter by hand.</h1>
  <p class="lead">Every connection starts collecting in the background immediately — so by the time you’ve confirmed the risk frame, discovery has already run. Skip any you don’t have; TrismX falls back to guided input.</p>
  <div class="grid cols-3" style="margin-top:18px">
    ${ints.map(([t,f,feed,on,pct,ev])=>`
      <div class="card int">
        <div class="top">
          <div class="ic">▤</div>
          <div style="min-width:0"><h3>${t}</h3><div class="feeds">Feeds: <strong>${feed}</strong></div></div>
        </div>
        <div class="muted" style="font-size:12px">${f}</div>
        ${on?`<div class="collect"><span class="dot" style="background:var(--ok)"></span>${pct===100?"Connected · collecting":"Connecting"} · <span class="mono">${ev}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`
             :`<button class="btn" style="padding:7px 12px;font-size:12.5px;align-self:flex-start">Connect</button>`}
      </div>`).join("")}
  </div>
  <p class="muted" style="font-size:12px;margin-top:14px">4 of 6 connected · background discovery running across the four shadow-AI entry vectors.</p>
  ${note("Connections drive the hybrid model",

/* ---- runtime ---- */
let cur = 0;
const stepsEl = document.getElementById('steps');
const viewsEl = document.getElementById('views');

STEPS.forEach((s,i)=>{
  const li=document.createElement('li');
  li.innerHTML=`<button class="step-btn" data-i="${i}">
    <span class="idx">${s.n}</span>
    <span><span class="step-label">${s.label}</span><br><span class="step-sub">${s.sub}</span></span>
  </button>`;
  stepsEl.appendChild(li);
});
stepsEl.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i);});

function render(){
  const key=STEPS[cur].key;
  viewsEl.innerHTML = views[key]();
  document.querySelectorAll('.step-btn').forEach((b,i)=>{
    b.classList.toggle('active',i===cur);
    b.classList.toggle('done',i<cur);
  });
  document.getElementById('progBar').style.width=((cur+1)/STEPS.length*100)+'%';
  document.getElementById('pctTxt').textContent=`Step ${cur+1} / ${STEPS.length}`;
  document.getElementById('backBtn').disabled=cur===0;
  document.getElementById('nextBtn').textContent=cur===STEPS.length-1?'Finish':'Continue';
  document.querySelector('.content').scrollTop=0;
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();}
document.getElementById('nextBtn').onclick=()=>{ if(cur<STEPS.length-1) go(cur+1); };
document.getElementById('backBtn').onclick=()=>go(cur-1);

document.getElementById('notesToggle').onclick=function(){
  document.body.classList.toggle('notes');
  this.classList.toggle('on',document.body.classList.contains('notes'));
};

const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{
  const root=document.documentElement;
  const dark=root.getAttribute('data-theme')==='dark'
    || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  root.setAttribute('data-theme',dark?'light':'dark');
};

render();
</script>
